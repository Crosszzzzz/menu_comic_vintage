<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#f6ead3" />
    <meta name="description" content="Carta de Botana, café de barrio. Mira cada producto de cerca y ponlo sobre tu mesa con realidad aumentada." />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <title>Botana — La carta en 3D</title>
    <script>
      // Theme falls back to the system preference; the header toggle persists a choice.
      (function () {
        var d = document.documentElement, K = 'botana-theme', t = null
        try { t = localStorage.getItem(K) } catch (e) {}
        if (t !== 'dark' && t !== 'light') t = matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light'
        d.classList.toggle('dark', t === 'dark')
      })()
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
